<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480">
<meta name="rg-design-size" content="480x1920">
<meta name="rg-layouts" content="480x1920 960x1100 1440x815 2880x500">
<meta name="rg-group-size" content="480x290+175">
<title>Atomic Sensor Panel</title>
<!--
  Mid-century "atomic age" sensor panel for the rg-Sens CSS Template
  displayer, drawn for 480x1920 portrait: atomic-print wallpaper, a brass and
  teak starburst wall clock, and cards of boomerang laminate edged in ribbed
  chrome trim that hold oven-thermostat dials, spinning atoms, martini
  glasses and a teak television. A sibling of the other example panels: the
  same placeholders 0-73 and the same setup.

  Setup: give the panel a Combination source, choose this file as the template
  under Display, and press Scan Placeholders. That adds the sensors below under
  Content (ones you already have are kept and reused) and binds every
  placeholder to the sensor with the matching source and metric:

    Clock      time, day and month names
    CPU        three sensors: temperature, usage, frequency
    GPU        five sensors: temperature, utilization, core clock, power usage,
               memory used
    Fan Speed  up to four fans (the sensor's caption is the label)
    Memory     used
    Disk       used
    Network    two sensors: download speed, upload speed
    Uptime     one sensor

  Captions label the atoms and the glasses; set them on the sensors.

  Anything left unbound is hidden: a bar, an atom, a glass, a whole card. The
  processor's power bar has no rg-Sens source and stays hidden unless you bind
  a sensor to it by hand on the Bindings tab.

  A thermostat's knob turns over 270 degrees from 20 to 100 degrees; the
  note beside it reads "Cool cat", "Toasty" (from 72) or "Sizzling!" (from
  85). A glass fills to the share of its pool that is in use, and the olive
  sinks with the level. The clock's hands follow the bound time; its red
  second hand steps with the system's seconds while motion is on.

  The television keeps the last minute (36 samples) in the page: inbound as a
  glowing line, outbound as a dashed one, on one shared scale. It starts
  empty and survives a reload of the template, not a restart of rg-Sens.

  Options (the panel's Display tab, or the top of atomic_panel.css): palette
  (Mint, Flamingo, Butterscotch), how the design fits the panel, the layout,
  the frame rate, and the full scale of the bars and of the television.

  Size: the design is drawn for 480x1920, but its six groups (the wall clock
  and the five cards) re-arrange to suit the panel: one column of six, two of
  three, three of two or six side by side (the rg-layouts list gives the size
  each needs), and the cards then stretch to the panel's exact shape. The
  wallpaper repeats over any size; the clock and the television keep their
  size and sit in the middle of their cells.

  Custom layouts: the template elements at the end of the body are the
  building blocks (two group styles and the clock, dial, bar, atom, glass,
  television and reading widgets) that "My own groups and widgets" builds
  groups from; see the guide's "Custom Layouts" section.

  Paper grit and teak grain are noise filters, which are costly to redraw;
  they carry data-rg-bake, so rg-Sens draws each once into a bitmap.

  Motion: the atoms turn with RPM, the second hand steps, the television
  flickers faintly and its newest sample pulses, at --motion-fps frames a
  second. 0 turns motion off, as do the panel's Animation switch and the
  system's reduced-motion setting.

  Fonts: Pacifico (script titles, the footer badge), Righteous (numbers, the
  clock) and Josefin Sans (labels), loaded from the fonts folder next to this
  file; copy that folder along with the template. Nothing is fetched from the
  network.
-->
<link rel="stylesheet" href="atomic_panel.css">
</head>
<body>
<div class="panel">

        <path class="s-boom" d="M18 84 Q34 70 50 84 Q36 80 28 94 Z" fill="none" stroke-width="1.2" opacity="0.35"></path>

        <path class="s-ink" d="M70 18 Q86 8 100 20 M20 80 Q34 70 46 82" fill="none" stroke-width="1" opacity="0.35"></path>
        <g class="f-fleck"><rect x="60" y="40" width="5" height="1.4" transform="rotate(30 60 40)"></rect><rect x="112" y="22" width="4" height="1.2" transform="rotate(-20 112 22)"></rect><rect x="30" y="58" width="4" height="1.2" transform="rotate(70 30 58)"></rect><rect x="74" y="96" width="5" height="1.3" transform="rotate(-40 74 96)"></rect><rect x="128" y="92" width="3" height="1.2"></rect><rect x="6" y="104" width="4" height="1.2" transform="rotate(50 6 104)"></rect></g>
        <g fill="#FFFFFF" opacity="0.7"><rect x="48" y="66" width="3" height="1"></rect><rect x="100" y="40" width="3" height="1" transform="rotate(60 100 40)"></rect><rect x="16" y="12" width="3" height="1"></rect></g>
        <g class="f-ink" opacity="0.3"><circle cx="66" cy="78" r="0.9"></circle><circle cx="118" cy="8" r="0.9"></circle><circle cx="40" cy="98" r="0.9"></circle><circle cx="92" cy="30" r="0.9"></circle></g>
      </pattern>
      <filter id="am-grit" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="3"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0 0.12  -1.1 0 0 0 0.7"></feColorMatrix></filter>
      <filter id="am-teakGrain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.28" numOctaves="3" seed="5" result="l"></feTurbulence>
        <feTurbulence type="fractalNoise" baseFrequency="0.01 0.006" numOctaves="2" seed="2" result="w"></feTurbulence>
        <feDisplacementMap in="l" in2="w" scale="18" xChannelSelector="R" yChannelSelector="G" result="b"></feDisplacementMap>
        <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0 0.04  0 0 0 2.2 -0.95" result="g"></feColorMatrix>
        <feComposite in="g" in2="SourceAlpha" operator="in"></feComposite>
      </filter>
      <filter id="am-blur3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter>
      <filter id="am-blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter>
      <!-- shadows cast by the moving parts (regions in the drawing's own units) -->
      <filter id="am-castHands" filterUnits="userSpaceOnUse" x="0" y="0" width="300" height="296"><feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#281400" flood-opacity="0.45"></feDropShadow></filter>
      <filter id="am-castKnob" filterUnits="userSpaceOnUse" x="40" y="40" width="130" height="130"><feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.4"></feDropShadow></filter>
      <filter id="am-castAtom" filterUnits="userSpaceOnUse" x="-50" y="-50" width="100" height="100"><feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.3"></feDropShadow></filter>
      <filter id="am-traceGlow" filterUnits="userSpaceOnUse" x="20" y="50" width="250" height="120"><feDropShadow dx="0" dy="0" stdDeviation="3" style="flood-color: var(--trace-in)" flood-opacity="1"></feDropShadow></filter>
      <linearGradient id="am-brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF2C2"></stop><stop offset="0.3" stop-color="#D8B058"></stop><stop offset="0.55" stop-color="#8A6420"></stop><stop offset="0.8" stop-color="#E8C878"></stop><stop offset="1" stop-color="#7A5618"></stop></linearGradient>
      <radialGradient id="am-brassBall" cx="0.36" cy="0.3" r="0.75"><stop offset="0" stop-color="#FFF8DC"></stop><stop offset="0.35" stop-color="#E2BA5E"></stop><stop offset="1" stop-color="#6E4C12"></stop></radialGradient>
      <linearGradient id="am-teak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8844A"></stop><stop offset="0.5" stop-color="#A2602C"></stop><stop offset="1" stop-color="#7A421A"></stop></linearGradient>
      <linearGradient id="am-chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.25" stop-color="#C9CCD0"></stop><stop offset="0.48" stop-color="#6E7276"></stop><stop offset="0.52" stop-color="#3A3C40"></stop><stop offset="0.78" stop-color="#A6AAAE"></stop><stop offset="1" stop-color="#F2F3F4"></stop></linearGradient>
      <radialGradient id="am-face" cx="0.42" cy="0.36" r="0.75"><stop offset="0" stop-color="#FFFDF6"></stop><stop offset="0.7" style="stop-color: var(--enamel)"></stop><stop offset="1" style="stop-color: var(--enamel-edge)"></stop></radialGradient>
      <radialGradient id="am-knobFace" cx="0.38" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.45" style="stop-color: var(--knob)"></stop><stop offset="1" style="stop-color: var(--knob-shade)"></stop></radialGradient>
      <linearGradient id="am-grip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color: var(--knob-shade)"></stop><stop offset="0.4" stop-color="#FFFFFF"></stop><stop offset="0.6" style="stop-color: var(--knob)"></stop><stop offset="1" style="stop-color: var(--knob-shade)"></stop></linearGradient>
      <radialGradient id="am-screen" cx="0.5" cy="0.45" r="0.65"><stop offset="0" style="stop-color: var(--screen-1)"></stop><stop offset="1" style="stop-color: var(--screen-2)"></stop></radialGradient>
      <radialGradient id="am-vignette" cx="0.5" cy="0.5" r="0.72"><stop offset="0.62" stop-color="#000" stop-opacity="0"></stop><stop offset="1" stop-color="#000" stop-opacity="0.6"></stop></radialGradient>

      <pattern id="am-cloth" patternUnits="userSpaceOnUse" width="4" height="4"><rect x="0" y="0" width="4" height="4" fill="#C8B48A"></rect><path d="M0 0 L4 4 M4 0 L0 4" stroke="#000" stroke-width="0.6" opacity="0.25"></path></pattern>

        <g fill="url(#am-teak) #A2602C"><use href="#am-spindle" transform="rotate(15 150 148)"></use><use href="#am-spindle" transform="rotate(45 150 148)"></use><use href="#am-spindle" transform="rotate(75 150 148)"></use><use href="#am-spindle" transform="rotate(105 150 148)"></use><use href="#am-spindle" transform="rotate(135 150 148)"></use><use href="#am-spindle" transform="rotate(165 150 148)"></use><use href="#am-spindle" transform="rotate(195 150 148)"></use><use href="#am-spindle" transform="rotate(225 150 148)"></use><use href="#am-spindle" transform="rotate(255 150 148)"></use><use href="#am-spindle" transform="rotate(285 150 148)"></use><use href="#am-spindle" transform="rotate(315 150 148)"></use><use href="#am-spindle" transform="rotate(345 150 148)"></use></g>
        <circle cx="150" cy="148" r="48" fill="url(#am-brass) #C9A048"></circle>

  // Write only what changed: an untouched page does not repaint.
  function attr(el, name, value) { if (el.getAttribute(name) !== value) el.setAttribute(name, value); }
  function text(el, value) { if (el.textContent !== value) el.textContent = value; }
  function style(el, prop, value) { if (el.style[prop] !== value) el.style[prop] = value; }
  function flag(el, name, on) { if (el.classList.contains(name) !== on) el.classList.toggle(name, on); }
  function hide(el, on) { if (el.hasAttribute('hidden') !== on) el.toggleAttribute('hidden', on); }
  function each(sel, fn, scope) { Array.prototype.forEach.call((scope || document).querySelectorAll(sel), fn); }
  function share(val, max, fallback) {
    if (!isFinite(val)) return 0;
    return clamp01(val / (max > 0 ? max : fallback));
  }
  // A clock given in MHz is shown, and scaled, in GHz.
  function isMhz(v, id) { return id !== null && /^mhz$/i.test(String(v[id] || '')); }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  // ------------------------------------------------------- history
  // One list of samples for each placeholder a television traces.
  var latest = {}, hist = {}, limit = {};
  var everMapped = false;
  var STORE = 'rg-atomic-history';
  try {
    var saved = JSON.parse(sessionStorage.getItem(STORE) || 'null');
    if (saved && Date.now() - saved.at < 90000 && saved.hist) {
      Object.keys(saved.hist).forEach(function (id) { hist[id] = saved.hist[id].slice(-SAMPLES); });
    }
  } catch (e) { /* no storage: the screen starts empty */ }

  // The value the top of the screen stands for. `peak` is the largest
  // sample of the last minute, `fixed` a full scale that was given (0 when
  // the screen is left to follow the peak).
  function fullScale(peak, fixed) {
    if (fixed > 0) return fixed;
    // Follow the peak in steps (1, 2, 4, 8, 16 ...), so the traces do not
    // rescale each time the peak moves a little.
    var full = 1;
    while (full < peak) full *= 2;
    return full;
  }
  // With nothing bound at all the screen shows a sample programme.
  function demo(kind) {
    var out = [];
    for (var i = 0; i < SAMPLES; i++) {
      out.push(kind === 'low' ? 1.4 + 0.7 * Math.sin(i * 0.55) + 0.4 * Math.sin(i * 1.7 + 1)
                              : 7.2 + 3.2 * Math.sin(i * 0.42 + 0.6) + 2.1 * Math.sin(i * 1.13) + 1.2 * Math.sin(i * 2.9 + 2));
    }
    return out;
  }
  // The newest sample at the right edge of the screen; a smooth line
  // through the samples (each one a control point, the curve passing
  // through the midpoints).
  function drawScreens() {
    each('[data-tv]', function (tv) {
      var lists = [], peak = 0, fixed = 0;
      var scale = tv.getAttribute('data-scale');
      if (scale) fixed = cssNum(scale, 0);
      each('[data-trace]', function (path) {
        var id = path.getAttribute('data-trace');
        var list = everMapped ? (hist[id] || []) : demo(path.getAttribute('data-demo'));
        if (!everMapped) fixed = 16;
        else if (tv.hasAttribute('data-max') && limit[id] > 0) fixed = limit[id];
        lists.push([path, id, list]);
        peak = Math.max.apply(null, list.concat([peak]));
      }, tv);
      var full = fullScale(peak, fixed);
      lists.forEach(function (entry) {
        var list = entry[2], n = list.length, d = '';
        var pts = list.map(function (val, i) { return [246 - (n - 1 - i) * 206 / (SAMPLES - 1), 152 - clamp01(val / full) * 86]; });
        function p(q) { return q[0].toFixed(1) + ' ' + q[1].toFixed(1); }
        if (n > 1) {
          d = 'M' + p(pts[0]);
          for (var i = 1; i < n - 1; i++) d += ' Q' + p(pts[i]) + ' ' + p([(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2]);
          d += ' L' + p(pts[n - 1]);
        }
        attr(entry[0], 'd', d);
        each('[data-dot="' + entry[1] + '"]', function (dot) {
          hide(dot, n === 0);
          if (n > 0) { attr(dot, 'cx', pts[n - 1][0].toFixed(1)); attr(dot, 'cy', pts[n - 1][1].toFixed(1)); }
        }, tv);
      });
    });
  }
  function sample() {
    var any = false;
    each('[data-trace]', function (path) {
      var id = path.getAttribute('data-trace');
      if (hist[id] && hist[id].stamp === sample.round) return;      // two screens may trace one sensor
      if (!isFinite(latest[id])) return;
      var list = hist[id] || (hist[id] = []);
      list.push(Math.round(latest[id] * 100) / 100);
      if (list.length > SAMPLES) list.shift();
      list.stamp = sample.round;
      any = true;
    });
    sample.round++;
    if (!any) return;
    drawScreens();
    try { sessionStorage.setItem(STORE, JSON.stringify({ at: Date.now(), hist: hist })); } catch (e) { /* ignore */ }
  }
  sample.round = 1;
  setInterval(sample, SAMPLE_MS);

  // ------------------------------------------------------- values
  var fanRpm = {};                      // placeholder id -> latest RPM, read by the motion ticker

  // The numbers round a thermostat: five, from the bottom left clockwise.
  function scaleLabel(n) {
    if (Math.abs(n) >= 10000) return Math.round(n / 1000) + 'k';
    if (Math.abs(n) >= 1000) return (Math.round(n / 100) / 10) + 'k';
    return String(Math.round(n * 10) / 10);
  }
  function dialNumbers(g, lo, hi) {
    var key = lo + '|' + hi;
    if (g.getAttribute('data-shown') === key) return;
    g.setAttribute('data-shown', key);
    while (g.firstChild) g.removeChild(g.firstChild);
    for (var i = 0; i < 5; i++) {
      var a = (135 + i * 67.5) * Math.PI / 180, t = document.createElementNS(SVG, 'text');
      t.setAttribute('x', (100 + 52 * Math.cos(a)).toFixed(1));
      t.setAttribute('y', (104 + 52 * Math.sin(a)).toFixed(1));
      t.setAttribute('text-anchor', 'middle');
      t.textContent = scaleLabel(lo + (hi - lo) * i / 4);
      g.appendChild(t);
    }
  }

  window.updateValues = function (v) {
    if (!v || typeof v !== 'object') return;
    var anyMapped = Object.keys(v).some(function (k) { return known(v[k]); });
    var first = anyMapped && !everMapped;
    if (anyMapped) everMapped = true;

    // Clock: hours and minutes of the bound time ("9:24 PM" shows 9:24).
    function hourMinute(id) { var t = v[id]; return /(\d{1,2}):(\d{2})/.exec(known(t) ? String(t) : ''); }
    each('[data-clock]', function (el) {
      var hm = hourMinute(el.getAttribute('data-clock'));
      text(el, hm ? hm[1] + ':' + hm[2] : '--:--');
    });
    // Hands: ten past ten until the time is known. An afternoon hour given
    // as "5:14 PM" points the same way as 17:14.
    each('[data-hands]', function (el) {
      var hm = hourMinute(el.getAttribute('data-hands')), h = hm ? +hm[1] : 10, m = hm ? +hm[2] : 10;
      each('[data-hand="hour"]', function (hand) { attr(hand, 'transform', 'rotate(' + ((h % 12 + m / 60) * 30).toFixed(1) + ' 150 148)'); }, el);
      each('[data-hand="minute"]', function (hand) { attr(hand, 'transform', 'rotate(' + (m * 6) + ' 150 148)'); }, el);
    });
    each('[data-date]', function (el) {    // Friday, 13 November: the ids of day name, day and month
      var ids = el.getAttribute('data-date').split(' '), day = num(v[ids[1]]);
      var rest = [isFinite(day) ? String(Math.round(day)) : '', known(v[ids[2]]) ? String(v[ids[2]]) : ''].filter(Boolean).join(' ');
      text(el, [known(v[ids[0]]) ? String(v[ids[0]]) : '', rest].filter(Boolean).join(', ') || ' ');
    });

    each('[data-num]', function (el) {
      var n = num(v[el.getAttribute('data-num')]);
      if (isMhz(v, el.getAttribute('data-unit-of'))) n /= 1000;
      var shown = fmt(n, +el.getAttribute('data-places'));
      text(el, el.hasAttribute('data-plain') ? shown.replace(/,/g, '') : shown);   // "of 1000 GB"
    });
    each('[data-unit]', function (el) {
      var id = el.getAttribute('data-unit'), u = v[id];
      text(el, isMhz(v, id) ? 'GHz' : known(u) ? String(u) : el.getAttribute('data-default'));
    });
    each('[data-cap]', function (el) {
      var c = v[el.getAttribute('data-cap')];
      text(el, known(c) ? String(c) : el.getAttribute('data-default'));
    });
    each('[data-uptime]', function (el) {  // Up 4 days & 7 hours
      var sec = num(v[el.getAttribute('data-uptime')]), shown = 'Up and at ’em';
      if (isFinite(sec)) {
        var d = Math.floor(sec / 86400), hr = Math.floor(sec / 3600) % 24, mn = Math.floor(sec / 60) % 60;
        shown = 'Up ' + (d > 0 ? plural(d, 'day') + ' & ' + plural(hr, 'hour')
                       : hr > 0 ? plural(hr, 'hour') + ' & ' + plural(mn, 'minute') : plural(mn, 'minute'));
      }
      text(el, shown);
    });

    // Thermostats: the knob turns over 270 degrees, from the bottom left
    // round to the bottom right. A hand-written dial has a fixed range
    // (data-lo, data-hi); a generated one takes its sensor's limits.
    each('[data-dial]', function (el) {
      var val = num(v[el.getAttribute('data-dial')]), lo, hi;
      if (el.hasAttribute('data-lo')) { lo = +el.getAttribute('data-lo'); hi = +el.getAttribute('data-hi'); }
      else {
        lo = num(v[el.getAttribute('data-min')]); hi = num(v[el.getAttribute('data-max')]);
        if (isMhz(v, el.getAttribute('data-unit-of'))) { val /= 1000; lo /= 1000; hi /= 1000; }
        if (!isFinite(lo)) lo = 0;
        if (!(hi > lo)) hi = lo + 100;
      }
      var f = isFinite(val) ? clamp01((val - lo) / (hi - lo)) : 0;
      each('[data-knob]', function (knob) { attr(knob, 'transform', 'rotate(' + (-135 + f * 270).toFixed(1) + ' 100 100)'); }, el);
      each('[data-nums]', function (g) { dialNumbers(g, lo, hi); }, el);
    });
    each('[data-state]', function (el) {
      var t = num(v[el.getAttribute('data-state')]);
      text(el, t >= HOT ? 'Sizzling!' : t >= WARM ? 'Toasty' : 'Cool cat');
      flag(el, 'hot', t >= HOT);
      flag(el, 'warm', t >= WARM && t < HOT);
    });

    // Bars: against the sensor's own maximum, else the limit in the
    // stylesheet (a number, or the name of a custom property). The fill is
    // never shorter than its own round ends.
    each('[data-bar]', function (el) {
      var val = num(v[el.getAttribute('data-bar')]), max = num(v[el.getAttribute('data-max')]);
      var scale = el.getAttribute('data-scale'), fallback = scale.charAt(0) === '-' ? cssNum(scale, 100) : +scale;
      if (isMhz(v, el.getAttribute('data-unit-of'))) { val /= 1000; max /= 1000; }
      style(el, 'width', 'max(14px, calc(' + (share(val, max, fallback) * 100).toFixed(1) + '% - 2px))');
    });
    each('[data-rotor]', function (el) {
      var rpm = num(v[el.getAttribute('data-rotor')]);
      fanRpm[el.getAttribute('data-rotor')] = isFinite(rpm) ? rpm : 0;
    });
    // Martini glasses: the bowl narrows from the rim (y 20, 46 either side)
    // to the stem (y 86); the drink fills it to the share in use, and the
    // olive rides the pick just under the surface.
    each('[data-glass]', function (el) {
      var f = share(num(v[el.getAttribute('data-glass')]), num(v[el.getAttribute('data-max')]), 100);
      var y = 86 - f * 62, half = (86 - y) / 66 * 46;
      each('[data-liquid]', function (p) {
        attr(p, 'd', f > 0 ? 'M' + (56 + half).toFixed(1) + ' ' + y.toFixed(1) + ' L56 86 L' + (56 - half).toFixed(1) + ' ' + y.toFixed(1) + ' Z' : '');
      }, el);
      each('[data-surface]', function (s) {
        attr(s, 'cy', y.toFixed(1)); attr(s, 'rx', Math.max(half - 1, 0).toFixed(1));
        hide(s, f <= 0);
      }, el);
      each('[data-olive]', function (o) {
        var oy = Math.min(Math.max(y + 6, 60), 74);
        attr(o, 'transform', 'translate(' + (78 - (oy - 22) * 32 / 56).toFixed(1) + ' ' + oy.toFixed(1) + ')');
      }, el);
    });
    each('[data-pct]', function (el) {
      var val = num(v[el.getAttribute('data-pct')]), max = num(v[el.getAttribute('data-max')]);
      text(el, isFinite(val) ? String(Math.round(share(val, max, 100) * 100)) : '--');
    });

    // Televisions: remember the latest reading of each traced sensor.
    each('[data-tv]', function (tv) {
      each('[data-trace]', function (path) {
        var id = path.getAttribute('data-trace');
        latest[id] = num(v[id]);
        limit[id] = num(v[tv.getAttribute('data-max')]);
      }, tv);
    });
    if (first) { sample(); drawScreens(); }   // the sample programme goes off the air

    // Hide what has no data. With nothing bound at all, show the whole design.
    each('[data-need]', function (el) {
      hide(el, anyMapped && !isFinite(num(v[el.getAttribute('data-need')])));
    });
    each('[data-section]', function (el) {
      hide(el, el.querySelector('[data-need]') !== null && el.querySelector('[data-need]:not([hidden])') === null);
    });
  };

  // ------------------------------------------------------- motion
  // Every CSS animation is paused and stepped from here at a fixed, low frame
  // rate: each frame costs a repaint in the web process and a present in
  // rg-Sens, so the rate is the cost. Positions follow the wall clock.
  var fps = cssNum('--motion-fps', 0);
  var reducedQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var reduced = !!(reducedQuery && reducedQuery.matches);
  var enabled = true, speed = 1;
  var timer = null, rotorAngle = {}, last = 0;
  var EPOCH = 1700000000000;

  function secondHands(seconds) {
    each('[data-hand="second"]', function (el) { attr(el, 'transform', 'rotate(' + seconds * 6 + ' 150 148)'); });
  }
  function frame() {
    var now = Date.now(), t = (now - EPOCH) * speed;
    var dt = Math.min((now - last) / 1000, 1);
    last = now;
    // Asked for afresh each frame: a cached list would revive cancelled ones.
    var anims = document.getAnimations();
    for (var i = 0; i < anims.length; i++) anims[i].currentTime = t;
    secondHands(new Date(now).getSeconds());
    // Atoms: one turn every 6000 / RPM seconds, but never more than about
    // 24 degrees a frame. The three orbits repeat every 60 degrees, so a
    // bigger step would read as standing still or turning backwards.
    each('[data-rotor]', function (el) {
      var id = el.getAttribute('data-rotor'), rpm = fanRpm[id] || 0;
      if (rpm <= 0) return;
      var step = Math.min(0.06 * rpm * dt * speed, 24 * (1 - Math.exp(-rpm / 1200)));
      rotorAngle[id] = ((rotorAngle[id] || 0) + step) % 360;
      el.setAttribute('transform', 'rotate(' + rotorAngle[id].toFixed(1) + ')');
    });
  }
  function applyMotion() {
    var on = enabled && !reduced && fps > 0;
    root.classList.toggle('still', !on);
    if (timer) { clearInterval(timer); timer = null; }
    if (!on) { secondHands(0); return; }
    last = Date.now();
    timer = setInterval(frame, 1000 / Math.min(fps, 30));
    frame();
  }
  // The panel's Animation switch and speed arrive with the first value update.
  window.addEventListener('rg-motion', function (e) {
    enabled = !!e.detail.enabled;
    speed = e.detail.speed > 0 ? e.detail.speed : 1;
    applyMotion();
  });
  if (reducedQuery && reducedQuery.addEventListener) {
    reducedQuery.addEventListener('change', function (e) { reduced = e.matches; applyMotion(); });
  }
  if (root.getAttribute('data-rg-motion') === 'off') enabled = false;
  applyMotion();
  window.updateValues({});              // hands, knobs and glasses in place before the first values arrive
  drawScreens();
})();
</script>
</body>
</html>
