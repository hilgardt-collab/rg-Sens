<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480">
<meta name="rg-design-size" content="480x1920">
<meta name="rg-layouts" content="480x1920 960x1360 1440x1060 2400x652">
<meta name="rg-group-size" content="480x338+232">
<title>Aircraft Cockpit Sensor Panel</title>
<!--
  Aircraft cockpit sensor panel for the rg-Sens CSS Template displayer, drawn
  for 480x1920 portrait: instrument plates in wrinkle paint with slotted
  screws, round gauges under glass with coloured operating ranges, amber
  readouts in recessed windows, a green-phosphor network display and an hour
  meter. Generic: no aircraft maker or avionics brand. A sibling of the other
  example panels: the same placeholders 0-73 and the same setup.

  Setup: give the panel a Combination source, choose this file as the template
  under Display, and press Scan Placeholders. That adds the sensors below under
  Content (ones you already have are kept and reused) and binds every
  placeholder to the sensor with the matching source and metric:

    Clock      time, day and month names
    CPU        three sensors: temperature, usage, frequency
    GPU        five sensors: temperature, utilization, core clock, power usage,
               memory used
    Fan Speed  up to four fans (the sensor's caption names the rev counter)
    Memory     used
    Disk       used
    Network    two sensors: download speed, upload speed
    Uptime     one sensor

  Anything left unbound is hidden: a narrow gauge, a rev counter, a quantity
  gauge, a whole plate. The processor's power gauge has no rg-Sens source and
  stays hidden unless you bind a sensor to it by hand on the Bindings tab.

  A temperature gauge sweeps 270 degrees from 20 to 100 (green to 72, yellow
  to 85, red above, a redline at 85); a rev counter 240 degrees from 0 to
  3000 rpm (redline 2400); a quantity gauge runs E to F over the top. The
  annunciators: SYS OK is lit unless something is wrong, TEMP lights amber
  when the CPU or GPU is at 85 degrees or above, FAN when a bound fan turns
  slower than 200 rpm. A readout over its limit turns red.

  The network display keeps the last minute (31 samples, one every 2 s) in
  the page: inbound as a solid green line with a faint fill, outbound as a
  dashed cyan line, on one shared scale. It starts empty and survives a
  reload of the template, not a restart of rg-Sens. The hour meter counts
  whole hours since boot, with the tenths on the white drum.

  Options (the panel's Display tab, or the top of cockpit_panel.css): panel
  finish (Classic Grey, Black Crinkle, Warbird Olive), how the design fits
  the panel, the layout, the frame rate, and the full scales.

  Size: the design is drawn for 480x1920, but its five instrument plates (the
  clock, temperatures, cooling, storage and the network display) re-arrange
  to suit the panel: one column, two, three or five side by side (the
  rg-layouts list gives the size each needs). A plate stretches to its cell
  with a screw in each corner; the instruments keep their proportions.

  Custom layouts: the template elements at the end of the body are the
  building blocks (two plate styles and the clock, round gauge, strip gauge,
  narrow gauge, rev counter, quantity gauge and readout widgets) that "My own
  groups and widgets" builds groups from; see the guide's "Custom Layouts"
  section.

  The wrinkle paint is a lit noise filter, which is costly to redraw; it
  carries data-rg-bake, so rg-Sens draws it once per plate into a bitmap.

  Motion: needles ease to new readings and wobble very slightly, the second
  hand steps and the newest network sample pulses, at --motion-fps frames a
  second. 0 turns motion off, as do the panel's Animation switch and the
  system's reduced-motion setting.

  Fonts: B612 (placards, dial numbers) and B612 Mono (readouts), loaded from
  the fonts folder next to this file; copy that folder along with the
  template. Nothing is fetched from the network.
-->
<link rel="stylesheet" href="cockpit_panel.css">
</head>
<body>
<div class="panel">
  <!-- shared drawings (never hidden) -->
  <svg class="defs" aria-hidden="true">
    <defs>
      <filter id="ck-crinkle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="2" result="n"></feTurbulence>
        <feDiffuseLighting in="n" surfaceScale="2.2" lighting-color="#ffffff" result="l"><feDistantLight azimuth="235" elevation="48"></feDistantLight></feDiffuseLighting>
        <feColorMatrix in="l" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"></feColorMatrix>
      </filter>
      <filter id="ck-shadow" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
      <filter id="ck-blur1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1"></feGaussianBlur></filter>
      <filter id="ck-nShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"></feGaussianBlur></filter>
      <filter id="ck-glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.2" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
      <filter id="ck-annGlow" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="5"></feGaussianBlur></filter>
      <linearGradient id="ck-bezel" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0" stop-color="#6A6E73"></stop><stop offset="0.25" stop-color="#2A2C2F"></stop>
        <stop offset="0.7" stop-color="#121314"></stop><stop offset="1" stop-color="#3A3D40"></stop>
      </linearGradient>
      <radialGradient id="ck-face" cx="0.45" cy="0.4" r="0.6"><stop offset="0" stop-color="#1E2022"></stop><stop offset="1" stop-color="#0E0F10"></stop></radialGradient>
      <radialGradient id="ck-screwG" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#E6E8EA"></stop><stop offset="0.45" stop-color="#8E9296"></stop><stop offset="1" stop-color="#2C2E30"></stop></radialGradient>
      <linearGradient id="ck-window" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000000"></stop><stop offset="1" stop-color="#111214"></stop></linearGradient>
      <linearGradient id="ck-drum" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000000"></stop><stop offset="0.3" stop-color="#2A2B2D"></stop><stop offset="0.5" stop-color="#3A3C3F"></stop>
        <stop offset="0.7" stop-color="#2A2B2D"></stop><stop offset="1" stop-color="#000000"></stop>
      </linearGradient>
      <linearGradient id="ck-drumW" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5A5A58"></stop><stop offset="0.3" stop-color="#D8D6D0"></stop><stop offset="0.5" stop-color="#F2F0EA"></stop>
        <stop offset="0.7" stop-color="#D8D6D0"></stop><stop offset="1" stop-color="#5A5A58"></stop>
      </linearGradient>
      <radialGradient id="ck-screen" cx="0.5" cy="0.45" r="0.7"><stop offset="0" stop-color="#08160D"></stop><stop offset="1" stop-color="#020805"></stop></radialGradient>
      <pattern id="ck-scan" patternUnits="userSpaceOnUse" width="4" height="3"><rect x="0" y="0" width="4" height="1" fill="#000" opacity="0.35"></rect></pattern>
      <linearGradient id="ck-key" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4D51"></stop><stop offset="0.5" stop-color="#2A2C2F"></stop><stop offset="1" stop-color="#151617"></stop></linearGradient>
      <radialGradient id="ck-knob" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#4E5155"></stop><stop offset="0.7" stop-color="#1C1D1F"></stop><stop offset="1" stop-color="#0A0A0B"></stop></radialGradient>
      <linearGradient id="ck-toggle" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#6E7276"></stop><stop offset="0.35" stop-color="#F2F4F6"></stop><stop offset="0.6" stop-color="#A6AAAE"></stop><stop offset="1" stop-color="#4A4D50"></stop>
      </linearGradient>
      <radialGradient id="ck-glassShade" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#000" stop-opacity="0"></stop><stop offset="0.82" stop-color="#000" stop-opacity="0"></stop>
        <stop offset="0.94" stop-color="#000" stop-opacity="0.35"></stop><stop offset="1" stop-color="#000" stop-opacity="0.75"></stop>
      </radialGradient>
      <linearGradient id="ck-glassTint" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"></stop><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.02"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
      </linearGradient>
      <radialGradient id="ck-hub" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#9A9EA2"></stop><stop offset="0.5" stop-color="#2E3033"></stop><stop offset="1" stop-color="#0A0A0B"></stop></radialGradient>
      <linearGradient id="ck-lineFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--line-1)" stop-opacity="0.28"></stop><stop offset="1" style="stop-color: var(--line-1)" stop-opacity="0.02"></stop></linearGradient>
      <g id="ck-screw"><circle r="5.2" fill="#000" opacity="0.5"></circle><circle r="4.4" fill="url(#ck-screwG)"></circle><path d="M-3.2 0 H3.2" stroke="#1A1B1C" stroke-width="1.3" stroke-linecap="round"></path></g>
    </defs>
  </svg>

  <section class="plate strip"><svg class="crinkle" aria-hidden="true"><rect data-rg-bake x="0" y="0" width="100%" height="100%" filter="url(#ck-crinkle)"></rect></svg><svg class="screw tl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(35)"></use></svg><svg class="screw tr" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(120)"></use></svg><svg class="screw bl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(75)"></use></svg><svg class="screw br" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(160)"></use></svg><svg class="face" viewBox="8 10 464 82" role="img" aria-label="Annunciator panel">
      <g class="engraved f-mark">
        <text x="26" y="60" font-size="21" letter-spacing="3.5">SYSTEM SENSORS</text>
        <text x="26" y="78" font-size="8.5" letter-spacing="2.2" opacity="0.75">ANNUNCIATOR · MONITOR PANEL</text>
      </g>
      <g data-ann="ok" transform="translate(268 26)"></g>
      <g data-ann="temp" transform="translate(334 26)" data-temps="5 21"></g>
      <g data-ann="fan" transform="translate(400 26)" data-fans="37 41 45 49"></g></svg></section>

  <div class="groups">
<!--rg-groups 0-71-->
  <section class="plate g-clock" data-section><svg class="crinkle" aria-hidden="true"><rect data-rg-bake x="0" y="0" width="100%" height="100%" filter="url(#ck-crinkle)"></rect></svg><svg class="screw tl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(35)"></use></svg><svg class="screw tr" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(120)"></use></svg><svg class="screw bl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(75)"></use></svg><svg class="screw br" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(160)"></use></svg><svg class="face" viewBox="8 100 464 292" role="img" aria-label="Clock">
      <g data-ck="clock" data-need="0" transform="translate(148 246)" data-time="0" data-date="1 2 3"></g></svg></section>
  <section class="plate g-temp" data-section><svg class="crinkle" aria-hidden="true"><rect data-rg-bake x="0" y="0" width="100%" height="100%" filter="url(#ck-crinkle)"></rect></svg><svg class="screw tl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(35)"></use></svg><svg class="screw tr" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(120)"></use></svg><svg class="screw bl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(75)"></use></svg><svg class="screw br" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(160)"></use></svg><svg class="face" viewBox="8 400 464 400" role="img" aria-label="Temperatures">
      <text class="engraved f-mark" x="240" y="424" text-anchor="middle" font-size="9" letter-spacing="2.4" opacity="0.85">TEMP °C</text>
      <g data-ck="gauge" data-need="5" transform="translate(124 524)" data-v="5" data-unit-of="6" data-lo="20" data-hi="100" data-label="CPU TEMP" data-screws></g>
      <g data-ck="gauge" data-need="21" transform="translate(356 524)" data-v="21" data-unit-of="22" data-lo="20" data-hi="100" data-label="GPU TEMP" data-screws></g>
      <g data-ck="tape" data-need="9" transform="translate(55 660)" data-v="9" data-max="11" data-unit-of="10" data-scale="100" data-label="LOAD" data-short></g>
      <g data-ck="tape" data-need="13" transform="translate(111 660)" data-v="13" data-max="15" data-unit-of="14" data-scale="--cpu-clock-max" data-label="CLK" data-short></g>
      <g data-ck="tape" data-need="17" transform="translate(167 660)" data-v="17" data-max="19" data-unit-of="18" data-scale="--cpu-power-max" data-label="PWR" data-short></g>
      <g data-ck="tape" data-need="25" transform="translate(287 660)" data-v="25" data-max="27" data-unit-of="26" data-scale="100" data-label="LOAD" data-short></g>
      <g data-ck="tape" data-need="29" transform="translate(343 660)" data-v="29" data-max="31" data-unit-of="30" data-scale="--gpu-clock-max" data-label="CLK" data-short></g>
      <g data-ck="tape" data-need="33" transform="translate(399 660)" data-v="33" data-max="35" data-unit-of="34" data-scale="--gpu-power-max" data-label="PWR" data-short></g></svg></section>
  <section class="plate g-fans" data-section><svg class="crinkle" aria-hidden="true"><rect data-rg-bake x="0" y="0" width="100%" height="100%" filter="url(#ck-crinkle)"></rect></svg><svg class="screw tl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(35)"></use></svg><svg class="screw tr" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(120)"></use></svg><svg class="screw bl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(75)"></use></svg><svg class="screw br" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(160)"></use></svg><svg class="face" viewBox="8 808 464 236" role="img" aria-label="Cooling">
      <text class="engraved f-mark" x="24" y="834" font-size="10" letter-spacing="2.4">COOLING · FAN RPM</text>
      <g data-ck="rpm" data-need="37" transform="translate(70 918)" data-v="37" data-cap="36" data-default="FAN 1"></g>
      <g data-ck="rpm" data-need="41" transform="translate(186 918)" data-v="41" data-cap="40" data-default="FAN 2"></g>
      <g data-ck="rpm" data-need="45" transform="translate(302 918)" data-v="45" data-cap="44" data-default="FAN 3"></g>
      <g data-ck="rpm" data-need="49" transform="translate(418 918)" data-v="49" data-cap="48" data-default="FAN 4"></g></svg></section>
  <section class="plate g-store" data-section><svg class="crinkle" aria-hidden="true"><rect data-rg-bake x="0" y="0" width="100%" height="100%" filter="url(#ck-crinkle)"></rect></svg><svg class="screw tl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(35)"></use></svg><svg class="screw tr" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(120)"></use></svg><svg class="screw bl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(75)"></use></svg><svg class="screw br" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(160)"></use></svg><svg class="face" viewBox="8 1052 464 288" role="img" aria-label="Storage">

      <g data-ck="tank" data-need="53" transform="translate(84 1180)" data-v="53" data-max="55" data-unit-of="54" data-label="MEMORY"></g>
      <g data-ck="tank" data-need="57" transform="translate(240 1180)" data-v="57" data-max="59" data-unit-of="58" data-label="VIDEO"></g>
      <g data-ck="tank" data-need="61" transform="translate(396 1180)" data-v="61" data-max="63" data-unit-of="62" data-label="DISK"></g></svg></section>
  <section class="plate mfd g-mfd" data-section><svg class="crinkle" aria-hidden="true"><rect data-rg-bake x="0" y="0" width="100%" height="100%" filter="url(#ck-crinkle)"></rect></svg><svg class="screw tl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(35)"></use></svg><svg class="screw tr" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(120)"></use></svg><svg class="screw bl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(75)"></use></svg><svg class="screw br" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(160)"></use></svg><svg class="face" viewBox="16 1356 448 420" role="img" aria-label="Network display">

<!--/rg-groups-->
  </div>

  <section class="plate foot" data-need="73"><svg class="crinkle" aria-hidden="true"><rect data-rg-bake x="0" y="0" width="100%" height="100%" filter="url(#ck-crinkle)"></rect></svg><svg class="screw tl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(35)"></use></svg><svg class="screw tr" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(120)"></use></svg><svg class="screw bl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(75)"></use></svg><svg class="screw br" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(160)"></use></svg><svg class="face" viewBox="8 1796 464 114" role="img" aria-label="Uptime">

<!-- Building blocks for a custom layout (Panel Properties > Display > Layout >
     "My own groups and widgets"): two plate styles and the instruments the
     groups are built from. Each instrument is one drawing in its own units,
     made by the script below from its data-ck kind, so a generated
     instrument is drawn exactly as the template's own. -->

<template data-rg-group="plate" data-rg-label="Instrument plate">
  <section class="plate ck-shell" data-section><svg class="crinkle" aria-hidden="true"><rect data-rg-bake x="0" y="0" width="100%" height="100%" filter="url(#ck-crinkle)"></rect></svg><svg class="screw tl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(35)"></use></svg><svg class="screw tr" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(120)"></use></svg><svg class="screw bl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(75)"></use></svg><svg class="screw br" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(160)"></use></svg><div class="ck-title">{{title}}</div><!--rg-items--></section>
</template>
<template data-rg-group="bare" data-rg-label="Plate, no title">
  <section class="plate ck-shell" data-section><svg class="crinkle" aria-hidden="true"><rect data-rg-bake x="0" y="0" width="100%" height="100%" filter="url(#ck-crinkle)"></rect></svg><svg class="screw tl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(35)"></use></svg><svg class="screw tr" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(120)"></use></svg><svg class="screw bl" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(75)"></use></svg><svg class="screw br" viewBox="-6 -6 12 12" aria-hidden="true"><use href="#ck-screw" transform="rotate(160)"></use></svg><!--rg-items--></section>
</template>
<template data-rg-widget="clock" data-rg-label="Clock and windows" data-rg-size="large" data-rg-sources="clock" data-rg-width="438" data-rg-height="256">
  <svg viewBox="-126 -128 438 256" role="img" aria-label="Clock and windows"><g data-ck="clock" data-need="{{time}}" data-time="{{time}}" data-date="{{day_name}} {{day:.0}} {{month_name}}"></g></svg>
</template>
<template data-rg-widget="clock" data-rg-label="Clock and windows" data-rg-size="medium" data-rg-sources="clock" data-rg-width="252" data-rg-height="252">
  <svg viewBox="-126 -126 252 252" role="img" aria-label="Clock and windows"><g data-ck="clock" data-need="{{time}}" data-time="{{time}}" data-date="{{day_name}} {{day:.0}} {{month_name}}" data-dial-only></g></svg>
</template>
<template data-rg-widget="gauge" data-rg-label="Round gauge" data-rg-size="large" data-rg-width="206" data-rg-height="206">
  <svg viewBox="-103 -103 206 206" role="img" aria-label="Round gauge"><g data-ck="gauge" data-need="{{value}}" data-v="{{value}}" data-max="{{max}}" data-unit-of="{{unit}}" data-cap="{{caption}}"></g></svg>
</template>
<template data-rg-widget="bar" data-rg-label="Strip gauge" data-rg-size="small" data-rg-width="125" data-rg-height="46">

<template data-rg-widget="bar" data-rg-label="Strip gauge" data-rg-size="large" data-rg-width="390" data-rg-height="30">

    if (anyMapped) everMapped = true;

    // Clocks: ten past ten until the time is known. "5:14 PM" reads as 17:14.
    each('[data-ck="clock"]', function (g) {
      var t = v[g.getAttribute('data-time')];
      var hm = /(\d{1,2}):(\d{2})/.exec(known(t) ? String(t) : ''), h = hm ? +hm[1] : 10, m = hm ? +hm[2] : 10;
      if (hm && /pm/i.test(String(t)) && h < 12) h += 12;
      if (hm && /am/i.test(String(t)) && h === 12) h = 0;
      each('[data-hand="hour"]', function (el) { place(el, (h % 12 + m / 60) * 30); }, g);
      each('[data-hand="minute"]', function (el) { place(el, m * 6); }, g);
      text(one(g, 'time'), hm ? ('0' + h).slice(-2) + ':' + hm[2] : '--:--');
      var ids = (g.getAttribute('data-date') || '').split(' '), day = num(v[ids[1]]);
      var name = known(v[ids[0]]) ? String(v[ids[0]]).slice(0, 3).toUpperCase() : '';
      var month = known(v[ids[2]]) ? String(v[ids[2]]).slice(0, 3).toUpperCase() : '';
      text(one(g, 'date'), [name, isFinite(day) ? String(Math.round(day)) : '', month].filter(Boolean).join(' ') || '--');
    });

    var hot = false;
    each('[data-ck="gauge"]', function (g) {
      var val = num(v[g.getAttribute('data-v')]), lo = 0, hi, unit = unitOf(v, g);
      if (g.hasAttribute('data-lo')) { lo = +g.getAttribute('data-lo'); hi = +g.getAttribute('data-hi'); }
      else { var r = reading(v, g); val = r.val; hi = r.full; }
      var f = isFinite(val) ? clamp01((val - lo) / (hi - lo)) : 0;
      aim(g, -135 + f * 270);
      for (var n = 0; n < 5; n++) text(one(g, 'n' + n), scaleLabel(lo + (hi - lo) * n / 4));
      text(one(g, 'cap'), caption(v, g), 96);
      var temp = g.hasAttribute('data-lo') || /°|^c$/i.test(unit);
      text(one(g, 'val'), isFinite(val) ? (temp ? String(Math.round(val)) : fmt(val, val < 10 ? 2 : 1)) : '--', 52);
      text(one(g, 'unit'), temp ? '' : unit.toUpperCase(), 40);
      flag(g, 'over', isFinite(val) && f >= 0.8125);
      if (g.hasAttribute('data-lo') && val >= HOT) hot = true;
    });
    each('[data-ck="tape"]', function (g) {
      var r = reading(v, g), f = isFinite(r.val) ? clamp01(r.val / r.full) : 0, y = 104 - f * 100;
      var fill = one(g, 'fill');
      attr(fill, 'y', f1(y)); attr(fill, 'height', f1(f * 100));
      attr(one(g, 'pointer'), 'transform', 'translate(19 ' + f1(y) + ')');
      var unit = unitOf(v, g), shown = fmt(r.val, unit === '%' ? 0 : r.val < 10 ? 2 : 1);
      if (g.hasAttribute('data-short')) shown += unit === '%' || unit.length === 1 ? unit : '';
      else shown += unit === '%' ? '%' : unit ? ' ' + unit : '';
      text(one(g, 'val'), isFinite(r.val) ? shown : '--', g.hasAttribute('data-short') ? 52 : 80);
      text(one(g, 'cap'), caption(v, g), g.hasAttribute('data-short') ? 52 : 76);
      flag(g, 'over', isFinite(r.val) && f >= 0.95);
    });
    each('[data-ck="hbar"]', function (g) {
      var r = reading(v, g), f = isFinite(r.val) ? clamp01(r.val / r.full) : 0;
      var geom = g.getAttribute('data-geom').split(' ').map(Number), gx = geom[0] + 4, len = geom[1] - geom[0] - 8, y = geom[2];
      attr(one(g, 'fill'), 'width', f1(len * f));
      attr(one(g, 'pointer'), 'transform', 'translate(' + f1(gx + len * f) + ' ' + (y + 10) + ')');
      var unit = unitOf(v, g), valEl = one(g, 'val');
      text(valEl, isFinite(r.val) ? fmt(r.val, unit === '%' ? 0 : r.val < 10 ? 2 : 1) + (unit === '%' ? '%' : unit ? ' ' + unit : '') : '--', g.hasAttribute('data-row') ? 68 : 90);
      var room = g.hasAttribute('data-row') ? 100 : (+g.getAttribute('data-w')) - (valEl.getBBox ? valEl.getBBox().width : 50) - 10;
      text(one(g, 'cap'), caption(v, g), Math.max(room, 12));
      flag(g, 'over', isFinite(r.val) && f >= 0.95);
    });
    var stalled = false;
    each('[data-ck="rpm"]', function (g) {
      var rpm = num(v[g.getAttribute('data-v')]), max = num(v[g.getAttribute('data-max')]);
      var full = max > 0 ? max : cssNum('--fan-max', 3000);
      var f = isFinite(rpm) ? clamp01(rpm / full) : 0;
      aim(g, -120 + f * 240);
      for (var n = 0; n < 4; n++) text(one(g, 'n' + n), String(Math.round(full * n / 3 / 100)));
      text(one(g, 'cap'), caption(v, g), 104);
      text(one(g, 'val'), isFinite(rpm) ? String(Math.round(rpm)) : '----');
      flag(g, 'over', isFinite(rpm) && f >= 0.8);
      if (isFinite(rpm) && rpm < STALL) stalled = true;
    });
    each('[data-ck="tank"]', function (g) {
      var r = reading(v, g), f = isFinite(r.val) ? clamp01(r.val / r.full) : 0;
      aim(g, -60 + f * 120);
      text(one(g, 'cap'), caption(v, g), 80);
      text(one(g, 'pct'), isFinite(r.val) ? Math.round(f * 100) + '%' : '--');
      var unit = unitOf(v, g), max = num(v[g.getAttribute('data-max')]);
      text(one(g, 'of'), isFinite(r.val) ? fmt(r.val, 1) + (max > 0 ? '/' + fmt(max, 1) : '') + (unit ? ' ' + unit : '') : '--', 112);
      flag(g, 'over', isFinite(r.val) && f >= 0.9);
    });
    each('[data-ck="readout"]', function (g) {
      var val = num(v[g.getAttribute('data-v')]), unit = unitOf(v, g);
      if (isMhz(v, g.getAttribute('data-unit-of'))) val /= 1000;
      text(one(g, 'cap'), caption(v, g), 126);
      text(one(g, 'val'), isFinite(val) ? fmt(val, val < 10 ? 2 : 1) + (unit === '%' ? '%' : unit ? ' ' + unit : '') : '--', 116);
    });
    each('[data-ck="mfd"]', function (g) {
      var unit = unitOf(v, g) || 'MB/s';
      ['in', 'out'].forEach(function (k) {
        var id = g.getAttribute('data-' + k), val = num(v[id]);
        latest[id] = val;
        text(one(g, k), isFinite(val) ? fmt(val, 1) : '--');
      });
      text(one(g, 'unit'), unit.toUpperCase());
      limit[g.getAttribute('data-in')] = num(v[g.getAttribute('data-max')]);
    });
    if (first) { sample(); drawScreens(); }   // the sample minute makes way for real data
    each('[data-uptime]', function (g) {      // whole hours, and tenths on the white drum
      var sec = num(v[g.getAttribute('data-uptime')]), digits = '00000';
      if (isFinite(sec)) {
        var tenths = Math.floor(Math.max(sec, 0) / 360);
        digits = ('0000' + tenths).slice(-5);
      }
      for (var i = 0; i < 5; i++) text(one(g, 'd' + i), digits.charAt(i));
    });
    each('[data-uptime-text]', function (el) {   // 4D 7H
      var sec = num(v[el.getAttribute('data-uptime-text')]), out = '--';
      if (isFinite(sec)) {
        var d = Math.floor(sec / 86400), hr = Math.floor(sec / 3600) % 24, mn = Math.floor(sec / 60) % 60;
        out = d > 0 ? d + 'D ' + hr + 'H' : hr + 'H ' + mn + 'M';
      }
      text(el, out);
    });
    // Annunciators: the temperatures and fans of the template's own gauges.
    each('[data-ann="temp"]', function (g) {
      g.getAttribute('data-temps').split(' ').forEach(function (id) { if (num(v[id]) >= HOT) hot = true; });
      annunciate(g, hot);
    });
    each('[data-ann="fan"]', function (g) {
      g.getAttribute('data-fans').split(' ').forEach(function (id) { var r = num(v[id]); if (isFinite(r) && r < STALL) stalled = true; });
      annunciate(g, stalled);
    });
    each('[data-ann="ok"]', function (g) { annunciate(g, !hot && !stalled); });

    // Hide what has no data. With nothing bound at all, show the whole design.
    each('[data-need]', function (el) {
      var raw = v[el.getAttribute('data-need')];
      hide(el, anyMapped && !isFinite(num(raw)) && !known(raw));
    });
    each('[data-section]', function (el) {
      hide(el, el.querySelector('[data-need]') !== null && el.querySelector('[data-need]:not([hidden])') === null);
    });
  };

  // ------------------------------------------------------- motion
  // Every CSS animation is paused and stepped from here at a fixed, low frame
  // rate: each frame costs a repaint in the web process and a present in
  // rg-Sens, so the rate is the cost. Positions follow the wall clock.
  var fps = cssNum('--motion-fps', 0);
  var reducedQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var reduced = !!(reducedQuery && reducedQuery.matches);
  var enabled = true, speed = 1;
  var timer = null, last = 0;
  var EPOCH = 1700000000000;

  function secondHands(seconds) {
    each('[data-hand="second"]', function (el) { place(el, seconds * 6); });
  }
  function frame() {
    var now = Date.now(), t = (now - EPOCH) * speed;
    var dt = Math.min((now - last) / 1000, 1);
    last = now;
    // Asked for afresh each frame: a cached list would revive cancelled ones.
    var anims = document.getAnimations();
    for (var i = 0; i < anims.length; i++) anims[i].currentTime = t;
    secondHands(new Date(now).getSeconds());
    // Needles: damped towards the reading (about 300 ms), then a wobble of
    // 0.7 degrees, each instrument at its own pace.
    var k = 1 - Math.exp(-dt * speed / 0.1), n = 0;
    each('[data-needle]', function (el) {
      var target = +el.getAttribute('data-target'), cur = +el.getAttribute('data-cur');
      if (!isFinite(target)) return;
      cur = isFinite(cur) ? cur + (target - cur) * k : target;
      el.setAttribute('data-cur', cur.toFixed(2));
      var period = 1.1 + (Math.floor(n / 2) % 9) * 0.3;
      place(el, cur + 0.7 * Math.sin(2 * Math.PI * t / 1000 / period + n));
      n++;
    });
  }
  function applyMotion() {
    var on = enabled && !reduced && fps > 0;
    moving = on;
    root.classList.toggle('still', !on);
    if (timer) { clearInterval(timer); timer = null; }
    if (!on) {
      secondHands(21);
      each('[data-needle]', function (el) { var target = +el.getAttribute('data-target'); if (isFinite(target)) { el.setAttribute('data-cur', target.toFixed(2)); place(el, target); } });
      return;
    }
    last = Date.now();
    timer = setInterval(frame, 1000 / Math.min(fps, 30));
    frame();
  }
  // The panel's Animation switch and speed arrive with the first value update.
  window.addEventListener('rg-motion', function (e) {
    enabled = !!e.detail.enabled;
    speed = e.detail.speed > 0 ? e.detail.speed : 1;
    applyMotion();
  });
  if (reducedQuery && reducedQuery.addEventListener) {
    reducedQuery.addEventListener('change', function (e) { reduced = e.matches; applyMotion(); });
  }
  if (root.getAttribute('data-rg-motion') === 'off') enabled = false;
  drawScreens();
  window.updateValues({});              // hands, needles and drums in place before the first values arrive
  applyMotion();
})();

</script>
</body>
</html>
