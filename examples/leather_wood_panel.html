<html lang="en">
<head>
<meta charset="utf-8">

<title>Leather &amp; Wood Sensor Panel</title>
<!--
  Leather & Wood sensor panel for the rg-Sens CSS Template displayer, 480x1920
  portrait. A sibling of the other example panels: same placeholders, same
  setup.

  Setup: give the panel a Combination source, choose this file as the template
  under Display, and press Scan Placeholders. That adds the sensors below under
  Content (ones you already have are kept and reused) and binds every
  placeholder to the sensor with the matching source and metric:

    Clock      time (the analogue hands and the digital time), day and month
    CPU        three sensors: temperature, usage, frequency
    GPU        five sensors: temperature, utilization, core clock, power usage,
               memory used
    Fan Speed  up to four fans (the sensor's caption labels its rev counter)
    Memory     used
    Disk       used
    Network    two sensors: download speed, upload speed
    Uptime     one sensor

  Captions label the two instruments ("Package", "Edge"), the rev counters and
  the memory rows; set them on the sensors.

  Anything left unbound is hidden: a row, a rev counter, a whole pad. The
  processor's power row has no rg-Sens source and stays hidden unless you bind
  a sensor to it by hand on the Bindings tab.

  The clock's hour and minute hands follow the bound clock; its seconds hand
  follows the system's seconds. The rev counters read 0 to 2400 rpm as printed.

  The chart recorder keeps the last minute (48 samples) of network in and out
  in the page, on a shared scale that follows the peak. It starts empty and
  survives a reload of the template, not a restart of rg-Sens.

  Options (the panel's Display tab, or the top of leather_wood_panel.css):
  wood, leather and metal, each chosen on its own; how the design fits the
  panel; the frame rate; the full-scale values of the bars.

  Size: the design is drawn for 480x1920, but its six groups re-arrange to
  suit the panel: one column of six, two of three, three of two or six side
  by side (the rg-layouts list gives the size each needs), and then take up
  the panel's exact shape. The Layout option fixes the column count; the Fit
  option can crop, letterbox or distort instead.

  Motion is deliberately slight: the seconds hand sweeps and the needles
  quiver, at --motion-fps frames a second. 0 turns it off, as do the panel's
  Animation switch and the system's reduced-motion setting (the seconds hand
  then steps once a second with the values).

  Fonts: Playfair Display and Lato, loaded from the fonts folder next to this
  file; copy that folder along with the template. Nothing is fetched from the
  network.
-->
<link rel="stylesheet" href="leather_wood_panel.css">
</head>

<script>
(function () {
  'use strict';
  var T_MIN = 20, T_MAX = 100;          // instrument scale, degrees C
  var REV_MAX = 2400;                   // rev counter scale, as printed on the dial
  var SAMPLES = 48, SAMPLE_MS = 1250;   // one minute of history
  var root = document.documentElement;
  var css = getComputedStyle(root);
  function cssNum(name, fallback) { var n = parseFloat(css.getPropertyValue(name)); return isFinite(n) ? n : fallback; }

  function num(v) {
    if (v === undefined || v === null) return NaN;
    var n = parseFloat(String(v).replace(/,/g, ''));
    return isFinite(n) ? n : NaN;
  }
  // Whole numbers from 100 up, otherwise at most `places` decimals.
  function fmt(n, places) {
    if (!isFinite(n)) return '--';
    var p = Math.abs(n) >= 100 ? 0 : places;
    return n.toLocaleString('en-US', { maximumFractionDigits: p });
  }
  function known(s) { return s !== undefined && s !== null && s !== '' && s !== '--'; }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  // Write only what changed: an untouched page does not repaint.
  function attr(el, name, value) { if (el.getAttribute(name) !== value) el.setAttribute(name, value); }
  function text(el, value) { if (el.textContent !== value) el.textContent = value; }
  function style(el, prop, value) { if (el.style[prop] !== value) el.style[prop] = value; }
  function each(sel, fn, scope) { Array.prototype.forEach.call((scope || document).querySelectorAll(sel), fn); }
  function share(val, max, fallback) {
    if (!isFinite(val)) return 0;
    return clamp01(val / (max > 0 ? max : fallback));
  }
  // Turn a hand or needle from the angle it was drawn at to `deg`.
  function turn(el, deg, centre) {
    attr(el, 'transform', 'rotate(' + (deg - +el.dataset.drawn).toFixed(2) + ' ' + centre + ' ' + centre + ')');
  }

  // ------------------------------------------------------- history
  var latest = { down: NaN, up: NaN };
  var hist = { down: [], up: [] };
  var STORE = 'rg-leather-history';
  try {
    var saved = JSON.parse(sessionStorage.getItem(STORE) || 'null');
    if (saved && Date.now() - saved.at < 90000 && saved.hist.down.length === saved.hist.up.length) {
      hist.down = saved.hist.down.slice(-SAMPLES); hist.up = saved.hist.up.slice(-SAMPLES);
    }
  } catch (e) { /* no storage: the paper starts blank */ }

  // Two ink traces, newest at the right edge, on a shared scale.
  function drawChart() {
    var svg = document.querySelector('[data-chart]');
    if (!svg) return;
    var peak = Math.max.apply(null, hist.down.concat(hist.up, [0]));
    var full = Math.max(peak * 1.1, 0.01), step = 378 / (SAMPLES - 1);
    function trace(values) {
      if (values.length < 2) return '';
      return 'M' + values.map(function (v, i) {
        var x = 378 - (values.length - 1 - i) * step, y = 85 - clamp01(v / full) * 76;
        return x.toFixed(1) + ' ' + y.toFixed(1);
      }).join(' L');
    }
    attr(svg.querySelector('[data-line="down"]'), 'd', trace(hist.down));
    attr(svg.querySelector('[data-line="up"]'), 'd', trace(hist.up));
  }
  function sample() {
    if (!isFinite(latest.down) && !isFinite(latest.up)) return;
    hist.down.push(isFinite(latest.down) ? Math.round(latest.down * 100) / 100 : 0);
    hist.up.push(isFinite(latest.up) ? Math.round(latest.up * 100) / 100 : 0);
    if (hist.down.length > SAMPLES) { hist.down.shift(); hist.up.shift(); }
    drawChart();
    try { sessionStorage.setItem(STORE, JSON.stringify({ at: Date.now(), hist: hist })); } catch (e) { /* ignore */ }
  }
  setInterval(sample, SAMPLE_MS);
  drawChart();

  // The seconds hand follows the system's seconds (the same in every time zone).
  function seconds(smooth) {
    var now = new Date(), s = now.getSeconds() + (smooth ? now.getMilliseconds() / 1000 : 0);
    each('[data-seconds]', function (el) { style(el, 'transform', 'rotate(' + (s * 6).toFixed(1) + 'deg)'); });
  }

  // ------------------------------------------------------- values
  var moving = false;

  window.updateValues = function (v) {
    if (!v || typeof v !== 'object') return;
    var anyMapped = Object.keys(v).some(function (k) { return known(v[k]); });

    // Time: the first four digits ("9:24 PM" shows 09:24); with a.m./p.m. the
    // hour hand still lands right, since it only needs the hour modulo 12.
    var digits = known(v['0']) ? String(v['0']).replace(/\D/g, '') : '';
    if (digits.length === 3 || digits.length === 5) digits = '0' + digits;
    var have = digits.length >= 4, h = have ? +digits.slice(0, 2) : 10, m = have ? +digits.slice(2, 4) : 10;
    each('[data-clock]', function (el) { text(el, have ? digits.slice(0, 2) + ':' + digits.slice(2, 4) : '--:--'); });
    each('[data-hand="hour"]', function (el) { turn(el, (h % 12 + m / 60) * 30 - 90, 100); });
    each('[data-hand="minute"]', function (el) { turn(el, m * 6 - 90, 100); });
    if (!moving) seconds(false);
    each('[data-day]', function (el) { text(el, known(v[el.dataset.day]) ? String(Math.round(num(v[el.dataset.day]))) : ''); });
    each('[data-date]', function (el) {    // Friday, 13 November
      var rest = [known(v['2']) ? String(v['2']) : '', known(v['3']) ? String(v['3']) : ''].join(' ').trim();
      text(el, [known(v['1']) ? String(v['1']) : '', rest].filter(Boolean).join(', ') || ' ');
    });

    each('[data-num]', function (el) { text(el, fmt(num(v[el.dataset.num]), +el.dataset.places)); });
    each('[data-unit]', function (el) { var u = v[el.dataset.unit]; text(el, known(u) ? String(u) : ''); });
    each('[data-cap]', function (el) {
      var c = v[el.dataset.cap];
      text(el, known(c) ? String(c).toUpperCase() : el.dataset.default);
    });
    each('[data-uptime]', function (el) {  // 4 days, 7 hours
      var sec = num(v[el.dataset.uptime]);
      if (!isFinite(sec)) { text(el, '--'); return; }
      var d = Math.floor(sec / 86400), hr = Math.floor(sec / 3600) % 24, mn = Math.floor(sec / 60) % 60;
      var say = function (n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); };
      text(el, d > 0 ? say(d, 'day') + ', ' + say(hr, 'hour') : hr > 0 ? say(hr, 'hour') + ', ' + say(mn, 'minute') : say(mn, 'minute'));
    });

    // Needles: 135 degrees + 270 x fraction, clockwise.
    each('[data-needle]', function (el) {
      var t = num(v[el.dataset.needle]);
      turn(el, 135 + 270 * (isFinite(t) ? clamp01((t - T_MIN) / (T_MAX - T_MIN)) : 0), el.dataset.center);
    });
    each('[data-rev]', function (el) {
      turn(el, 135 + 270 * share(num(v[el.dataset.rev]), REV_MAX, REV_MAX), 60);
    });

    // Grooves: against the sensor's own maximum, else the limit in the
    // stylesheet (a number, or the name of a custom property).
    each('[data-bar]', function (el) {
      var val = num(v[el.dataset.bar]), max = num(v[el.dataset.max]);
      var scale = el.dataset.scale, fallback = scale.charAt(0) === '-' ? cssNum(scale, 100) : +scale;
      if (/mhz/i.test(String(v[el.dataset.unitOf] || '')) && scale.indexOf('clock') > 0) fallback *= 1000;
      var f = share(val, max, fallback);
      style(el, 'width', f > 0 ? 'calc(' + (f * 100).toFixed(1) + '% - ' + el.dataset.inset + 'px)' : '0px');
    });

    latest.down = num(v['65']); latest.up = num(v['69']);

    // Hide what has no data. With nothing bound at all, show the whole design.
    each('[data-need]', function (el) {
      var hide = anyMapped && !isFinite(num(v[el.dataset.need]));
      if (el.hidden !== hide) el.hidden = hide;
    });
    each('[data-section]', function (el) {
      var hide = anyMapped && el.dataset.section === 'clock' ? !have :
                 el.querySelector('[data-need]') !== null && el.querySelector('[data-need]:not([hidden])') === null;
      if (el.hidden !== hide) el.hidden = hide;
    });
  };

  // ------------------------------------------------------- motion
  // The needles' CSS animations are paused and stepped from here at a fixed,
  // low frame rate, and the seconds hand is turned on the same tick: each
  // frame costs a repaint in the web process and a present in rg-Sens, so
  // the rate is the cost.
  var fps = cssNum('--motion-fps', 0);
  var reducedQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var reduced = !!(reducedQuery && reducedQuery.matches);
  var enabled = true, speed = 1;
  var timer = null, anims = [], tick = 0;
  var EPOCH = 1700000000000;

  function frame() {
    var t = (Date.now() - EPOCH) * speed;
    if (tick % (fps * 5 | 0 || 1) === 0) anims = document.getAnimations();   // pads may have appeared
    for (var i = 0; i < anims.length; i++) anims[i].currentTime = t;
    seconds(true);
    tick++;
  }
  function applyMotion() {
    moving = enabled && !reduced && fps > 0;
    root.classList.toggle('still', !moving);
    if (timer) { clearInterval(timer); timer = null; }
    if (!moving) { seconds(false); return; }
    tick = 0;
    timer = setInterval(frame, 1000 / Math.min(fps, 30));
    frame();
  }
  // The panel's Animation switch and speed arrive with the first value update.
  window.addEventListener('rg-motion', function (e) {
    enabled = !!e.detail.enabled;
    speed = e.detail.speed > 0 ? e.detail.speed : 1;
    applyMotion();
  });
  if (reducedQuery && reducedQuery.addEventListener) {
    reducedQuery.addEventListener('change', function (e) { reduced = e.matches; applyMotion(); });
  }
  if (root.getAttribute('data-rg-motion') === 'off') enabled = false;
  applyMotion();
})();
</script>
